name: Check toolkit
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  template:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: node scripts/check.mjs
      - run: node scripts/test-toolkit.mjs
      - name: Build production image
        if: runner.os == 'Linux'
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -t app-toolkit skills/app-bootstrap-adm/assets/app
      - name: Check container
        if: runner.os == 'Linux'
        run: |
          docker run -d --name app-toolkit --read-only --tmpfs /tmp -e ORIGIN=https://example.com -p 127.0.0.1:4330:3000 app-toolkit
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 20 --max-time 5 http://127.0.0.1:4330/healthz
      - name: Check production app in Chromium
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --ignore-scripts --no-package-lock --no-audit --no-fund playwright@1.64.0
          npx --no-install playwright install --with-deps chromium
          node scripts/test-browser.mjs ${{ github.sha }}
      - name: Stop container
        if: always() && runner.os == 'Linux'
        run: docker rm -f app-toolkit || true
